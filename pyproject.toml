[project]
name = "craftax-agents"
version = "0.1.0"
description = "Bring a Craftax agent to the browser: the playable ONNX format, converters, a checker on the exact C engine, and the registry of agents playcraftax.com offers"
requires-python = ">=3.10"
dependencies = ["numpy", "onnx", "onnxruntime"]
license = { text = "MIT" }
readme = "README.md"

[project.optional-dependencies]
jax = ["jax", "flax", "craftax==1.6.1"]          # the JAX converters' checks, symbolic.py --check
baselines = ["jax", "flax", "orbax-checkpoint"]   # export_baselines_rnn.py (Orbax checkpoints)
variants = ["safetensors"]                        # variants.py

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["craftax_agents"]
